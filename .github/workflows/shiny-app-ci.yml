name: Shiny App CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/shiny_app/**'
      - 'scripts/**'
      - 'deploy/**'
      - '.gitignore'
      - '.github/workflows/shiny-app-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/shiny_app/**'
      - 'scripts/**'
      - 'deploy/**'
      - '.gitignore'
      - '.github/workflows/shiny-app-ci.yml'

permissions:
  contents: read

jobs:
  parse-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Initialize evidence directory
        run: mkdir -p "${RUNNER_TEMP}/islet-ci-r"

      - name: Configure isolated R library
        shell: bash
        run: |
          set -euo pipefail
          r_library="${RUNNER_TEMP}/islet-r-library"
          mkdir -p "${r_library}"
          printf 'R_LIBS_USER=%s\n' "${r_library}" >> "${GITHUB_ENV}"

      # Ubuntu's precompiled r-cran-* debs bundle their system dependencies
      # (including GDAL/GEOS for sf). DuckDB is not packaged by Ubuntu, so it is
      # installed into an isolated runner library in the next step.
      - name: Install R and test packages
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          mkdir -p "${R_LIBS_USER}"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential r-base-core r-base-dev \
            r-cran-testthat r-cran-shiny r-cran-dplyr r-cran-tidyr \
            r-cran-tibble r-cran-lme4 r-cran-lmertest \
            r-cran-dbi r-cran-digest r-cran-jsonlite r-cran-sf r-cran-data.table \
            r-cran-lintr bandit

      - name: Install verified DuckDB 1.5.2 test binary
        run: Rscript deploy/install-ci-duckdb.R

      # The backend tests contain defensive skip_if_not_installed() guards for
      # developer laptops. CI turns those dependencies into hard requirements so
      # Parquet parity, SHA-256 validation, and GeoPackage indexing cannot skip.
      - name: Verify non-optional test capabilities
        run: |
          Rscript -e 'required <- c("testthat", "shiny", "dplyr", "tidyr", "tibble", "lme4", "lmerTest", "DBI", "duckdb", "digest", "jsonlite", "sf", "lintr", "data.table"); missing <- required[!vapply(required, requireNamespace, logical(1), quietly = TRUE)]; if (length(missing)) stop("Missing required CI packages: ", paste(missing, collapse = ", ")); if (!("GPKG" %in% sf::st_drivers()$name)) stop("sf/GDAL lacks the GPKG driver required by backend tests"); message("Backend test capabilities verified: ", paste(required, collapse = ", "))'

      - name: Parse-check application and release R sources
        run: |
          Rscript app/shiny_app/tests/parse_check.R
          Rscript -e 'files <- c(list.files("scripts", pattern = "[.]R$", recursive = TRUE, full.names = TRUE), list.files("deploy", pattern = "[.]R$", recursive = TRUE, full.names = TRUE)); if (!length(files)) stop("No scripts/deploy R files found"); for (file in files) tryCatch(parse(file = file), error = function(e) stop(file, ": ", conditionMessage(e))); message("Parsed ", length(files), " scripts/deploy R files")'

      - name: Lint deployed R runtime for correctness and unsafe calls
        run: Rscript deploy/lint-runtime-r.R

      - name: Parse-check Python sources
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          files = sorted(Path("app/shiny_app/python").rglob("*.py"))
          files += sorted(Path("scripts").rglob("*.py"))
          files += sorted(Path("deploy").rglob("*.py"))
          if not files:
              raise SystemExit("No application/script Python files found")
          for path in files:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print(f"Parsed {len(files)} application/script Python files")
          PY

      - name: Run Bandit on deployed Python runtime
        run: bandit --quiet --recursive app/shiny_app/python deploy/r-worker.py

      - name: Run R suites with zero skipped tests
        shell: bash
        run: |
          set -euo pipefail
          for suite in app parity extraction; do
            Rscript scripts/run_ci_r_tests.R "$suite" "${RUNNER_TEMP}/islet-ci-r" 2>&1 | tee "${RUNNER_TEMP}/islet-ci-r/${suite}-tests.log"
          done

      - name: Install inventory test and pinned browser SAST tools
        run: |
          python3 -m pip install numpy==2.2.6 h5py==3.15.1 tifffile==2025.10.16 semgrep==1.176.1
          python3 -m pip freeze --all > "${RUNNER_TEMP}/islet-ci-r/python-tools.txt"
          Rscript -e 'p <- as.data.frame(installed.packages()[, c("Package", "Version"), drop=FALSE]); write.table(p[order(p$Package), ], file.path(Sys.getenv("RUNNER_TEMP"), "islet-ci-r", "R-test-packages.tsv"), sep="\t", row.names=FALSE, quote=FALSE)'
          node --version > "${RUNNER_TEMP}/islet-ci-r/node-version.txt"

      - name: Verify browser harness dependencies and syntax
        working-directory: deploy/browser
        shell: bash
        run: |
          set -euo pipefail
          # Browser execution stays with the real-data acceptance harness.
          # CI verifies this exact lockfile without downloading a browser.
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee "${RUNNER_TEMP}/islet-ci-r/browser-npm-ci.log"
          npm --version > "${RUNNER_TEMP}/islet-ci-r/npm-version.txt"
          npm ls --all --json > "${RUNNER_TEMP}/islet-ci-r/browser-dependencies.json"
          cp package.json package-lock.json "${RUNNER_TEMP}/islet-ci-r/"
          node --check check-app.mjs
          npm audit --audit-level=high --json > "${RUNNER_TEMP}/islet-ci-r/browser-npm-audit.json"

      - name: Test sanitized data inventory with zero skips
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "${RUNNER_TEMP}/islet-ci-r/inventory-tests.log"
          import importlib.util
          import json
          import os
          from pathlib import Path
          import unittest
          spec = importlib.util.spec_from_file_location("inventory_tests", "scripts/tests/test_inventory_release_data.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromModule(module))
          summary = {"tests": result.testsRun, "failed": len(result.failures), "errors": len(result.errors), "skipped": len(result.skipped)}
          path = Path(os.environ["RUNNER_TEMP"]) / "islet-ci-r/inventory-tests.json"
          path.write_text(json.dumps(summary, indent=2) + "\n")
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun and not result.skipped else 1)
          PY

      - name: Scan authored and R-embedded browser code
        run: bash deploy/scan-browser-code.sh --output "${RUNNER_TEMP}/islet-ci-r/browser-sast"

      - name: Retain test and browser SAST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-python-browser-sast-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/islet-ci-r/
          retention-days: 90
          if-no-files-found: error

  deployment-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Initialize evidence directory
        run: mkdir -p "${RUNNER_TEMP}/islet-ci-deploy"

      - name: Install ShellCheck
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Check deployment shell syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(find deploy -type f -name '*.sh' -print0)
          if (( ${#scripts[@]} == 0 )); then
            echo 'No deployment shell scripts found.' >&2
            exit 1
          fi
          for script in "${scripts[@]}"; do
            bash -n "${script}"
          done

      - name: Run ShellCheck on deployment scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(find deploy -type f -name '*.sh' -print0)
          shellcheck --severity=warning "${scripts[@]}"

      - name: Test image scan and release-evidence contracts
        shell: bash
        run: |
          set -euo pipefail
          for suite in image-evidence deployment-verifier deployment-recovery; do
            bash "deploy/tests/test-${suite}.sh" 2>&1 | tee "${RUNNER_TEMP}/islet-ci-deploy/${suite}.log"
          done

      - name: Test viewer URL boundary with zero skips
        shell: bash
        run: |
          set -euo pipefail
          node --test-reporter=tap deploy/tests/test-viewer-boundary.mjs 2>&1 | tee "${RUNNER_TEMP}/islet-ci-deploy/viewer-tests.tap"
          grep -Fx '# skipped 0' "${RUNNER_TEMP}/islet-ci-deploy/viewer-tests.tap"
          grep -Fx '# cancelled 0' "${RUNNER_TEMP}/islet-ci-deploy/viewer-tests.tap"
          grep -Fx '# todo 0' "${RUNNER_TEMP}/islet-ci-deploy/viewer-tests.tap"
          test "$(awk '/^# tests / {print $3}' "${RUNNER_TEMP}/islet-ci-deploy/viewer-tests.tap")" -ge 31

      - name: Test SBOM identity correction and external authentication verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "${RUNNER_TEMP}/islet-ci-deploy/reviewer-access-tests.log"
          import json
          import os
          from pathlib import Path
          import unittest
          suite = unittest.TestSuite(unittest.defaultTestLoader.discover("deploy/tests", pattern=pattern) for pattern in ("test_reviewer_access.py", "test_sbom_correction.py"))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          summary = {"tests": result.testsRun, "failed": len(result.failures), "errors": len(result.errors), "skipped": len(result.skipped)}
          path = Path(os.environ["RUNNER_TEMP"]) / "islet-ci-deploy/reviewer-access-tests.json"
          path.write_text(json.dumps(summary, indent=2) + "\n")
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun and not result.skipped else 1)
          PY

      # This is a deterministic tracked-file gate, not a replacement for GitHub
      # secret scanning. It reports filenames only so a detected value is never
      # copied into CI output. Minified vendored Avivator bundles are excluded
      # from the heuristic content regex; filenames remain covered.
      - name: Reject tracked credentials and likely secrets
        shell: bash
        run: |
          set -euo pipefail

          forbidden=()
          while IFS= read -r -d '' path; do
            base="${path##*/}"
            case "${base}" in
              .Renviron|.env|.env.*|id_rsa|id_ed25519|credentials.json|secrets.json|*.pem|*.key|*.p12|*.pfx)
                case "${base}" in
                  *.example|*.sample|*.template) ;;
                  *) forbidden+=("${path}") ;;
                esac
                ;;
            esac
          done < <(git ls-files -z)

          if (( ${#forbidden[@]} > 0 )); then
            echo 'Tracked credential-like filenames are forbidden:' >&2
            printf '  %s\n' "${forbidden[@]}" >&2
            exit 1
          fi

          secret_pattern='-----BEGIN [A-Z ]*PRIVATE KEY-----|'
          secret_pattern+='A''KIA[0-9A-Z]{16}|A''SIA[0-9A-Z]{16}|'
          secret_pattern+='s''k-(proj-)?[A-Za-z0-9_-]{20,}|'
          secret_pattern+='g''h[pousr]_[A-Za-z0-9]{30,}|'
          secret_pattern+='x''ox[baprs]-[A-Za-z0-9-]{20,}|'
          secret_pattern+='A''Iza[0-9A-Za-z_-]{35}|'
          secret_pattern+='(OPENAI_API_KEY|API_KEY|PASSWORD|TOKEN|SECRET)[[:space:]]*=[[:space:]]*[A-Za-z0-9_+./=-]{20,}'

          if secret_files="$(git grep -IlE -e "${secret_pattern}" -- . \
              ':(exclude)app/shiny_app/www/avivator/assets/**')"; then
            echo 'Likely secret material found in tracked files (contents suppressed):' >&2
            printf '  %s\n' "${secret_files}" >&2
            exit 1
          else
            grep_status=$?
            if (( grep_status != 1 )); then
              echo "Tracked-secret scan failed with git grep status ${grep_status}." >&2
              exit "${grep_status}"
            fi
          fi

      - name: Retain deployment and viewer test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-viewer-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/islet-ci-deploy/
          retention-days: 90
          if-no-files-found: error

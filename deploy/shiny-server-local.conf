# DEVELOPMENT ONLY: local research app on loopback port 3840. Not the production
# path; production uses the rootless Podman/Quadlet release in deploy/README.md.
run_as smith6jt;
preserve_logs true;
sanitize_errors true;
socket_dir /tmp;
bookmark_state_dir /tmp;

server {
  listen 3840 127.0.0.1;
  location /islet-explorer/images/ {
    site_dir /data/panc_CODEX/Islet-Explorer/data/development/uniform-20donor-20261022-v10/images;
    log_dir /data/panc_CODEX/Islet-Explorer/tmp/local-app-logs;
    directory_index off;
  }
  location /islet-explorer/local_images/ {
    site_dir /data/panc_CODEX/Islet-Explorer/data/development/uniform-20donor-20261022-v10/images;
    log_dir /data/panc_CODEX/Islet-Explorer/tmp/local-app-logs;
    directory_index off;
  }
  location /islet-explorer/ {
    app_dir /data/panc_CODEX/Islet-Explorer/app/shiny_app;
    log_dir /data/panc_CODEX/Islet-Explorer/tmp/local-app-logs;
    app_init_timeout 240;
    app_idle_timeout 0;
    directory_index off;
  }
}

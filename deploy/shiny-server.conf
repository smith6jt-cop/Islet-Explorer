# Production Shiny Server configuration. The rootless Podman service maps the
# host PubApps service user to the image's `shiny` UID/GID; shiny-server and its
# workers therefore run as the same unprivileged identity.
run_as shiny;

preserve_logs true;
sanitize_errors true;

server {
  # Listen on the container interface. Security is enforced by Podman's host
  # publication rule, which exposes this only as 127.0.0.1:3838 on the VM.
  listen 3838;

  location /islet-explorer/ {
    # Code is immutable and baked into the image. From this working directory,
    # the legacy ../../data paths resolve to the read-only data mount at
    # /srv/islet-explorer/data. OME-TIFFs are mounted directly beneath www so
    # Shiny Server's static handler can satisfy HTTP Range requests.
    app_dir /srv/islet-explorer/app/shiny_app;

    log_dir /var/log/shiny-server;

    app_init_timeout 180;
    app_idle_timeout 600;

    directory_index off;
  }
}

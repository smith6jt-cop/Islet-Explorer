# Production Shiny Server configuration. The rootless Podman service maps the
# host PubApps service user to the image's `shiny` UID/GID; shiny-server and its
# workers therefore run as the same unprivileged identity.
run_as shiny;

# Successful-session worker logs are removed when the worker exits; Shiny still
# retains logs for abnormal exits for bounded incident diagnosis.
preserve_logs false;
sanitize_errors true;
log_file_mode 0640;

server {
  # Listen on the container interface. Security is enforced by Podman's host
  # publication rule, which exposes this only as 127.0.0.1:3838 on the VM.
  listen 3838;

  # app_dir requests are forwarded to R/httpuv, whose static responses do not
  # satisfy TIFF byte ranges. These specific routes use Shiny Server's static
  # handler and the same immutable image collection for all supported aliases.
  location /islet-explorer/local_images/ {
    site_dir /srv/islet-explorer/app/shiny_app/www/local_images;
    log_dir /var/log/shiny-server;
    directory_index off;
  }
  location /islet-explorer/images/ {
    site_dir /srv/islet-explorer/app/shiny_app/www/local_images;
    log_dir /var/log/shiny-server;
    directory_index off;
  }
  location /islet-explorer/img_data/ {
    site_dir /srv/islet-explorer/app/shiny_app/www/local_images;
    log_dir /var/log/shiny-server;
    directory_index off;
  }

  location /islet-explorer/ {
    # Code is immutable and baked into the image. From this working directory,
    # the legacy ../../data paths resolve to the read-only data mount at
    # /srv/islet-explorer/data. The explicit image routes above bypass the
    # application worker to satisfy HTTP Range requests.
    app_dir /srv/islet-explorer/app/shiny_app;

    log_dir /var/log/shiny-server;

    app_init_timeout 180;
    app_idle_timeout 600;

    directory_index off;
  }
}

# shiny-server config for the Islet Explorer container (baked into the image at
# /etc/shiny-server/shiny-server.conf by deploy/islet-explorer.def).
#
# Serves the app at  http://<vm>:3838/islet-explorer/  — RC's reverse proxy maps the
# public https://islet-explorer.rc.ufl.edu/... host + SSL onto this port/path.

# run_as: the OS user the R worker runs as. shiny-server normally starts as root and
# drops to this user. Under ROOTLESS Apptainer/Podman there is no root to drop from, so
# the process runs as the container's mapped user regardless — coordinate the final value
# with RC's launch setup (they may run the whole container as $serviceuser). `shiny` is the
# rocker default and is fine when RC launches with a root-capable runtime.
run_as shiny;

# Keep worker logs even on clean exit — essential for spotting the silent anndata->Excel
# fallback and reticulate/Bioconductor load errors after deploy.
preserve_logs true;
sanitize_errors false;

server {
  listen 3838;

  location /islet-explorer/ {
    # Point straight at the bind-mounted app dir (deploy/run.sh mounts
    # /pubapps/$project/islet-explorer -> /srv/islet-explorer). No symlink needed:
    # shiny-server sets the worker CWD to this dir, so the app's relative data paths
    # (`file.path("..","..","data",...)`) resolve to /srv/islet-explorer/data. ✅
    app_dir /srv/islet-explorer/app/shiny_app;

    log_dir /var/log/shiny-server;

    # Heavy first render (H5AD via reticulate + 162 MB cell_distance.csv) can exceed the
    # 60 s default; give startup headroom and keep idle sessions alive between interactions.
    app_init_timeout 120;
    app_idle_timeout 600;

    directory_index off;
  }
}

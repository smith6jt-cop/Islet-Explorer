<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960" role="img" aria-labelledby="title desc">
  <title id="title">Panc Floyd / Islet Explorer PubApps deployment and data-flow architecture</title>
  <desc id="desc">Journal reviewers reach a UFRC reverse proxy over HTTPS and Basic Authentication. The proxy forwards WebSocket and byte-range traffic to a rootless Islet Explorer container on a PubApps virtual machine. Scientific data and OME-TIFF images are mounted read-only; only temporary downloads and logs are writable. Maintainers connect through HiPerGator and SSH. Release artifacts enter only during deployment.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#254b72"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #17324d; }
      .subtitle { font: 18px Arial, sans-serif; fill: #42566a; }
      .box-title { font: 700 22px Arial, sans-serif; fill: #17324d; }
      .body { font: 17px Arial, sans-serif; fill: #263746; }
      .small { font: 15px Arial, sans-serif; fill: #405466; }
      .boundary { fill: #f7fafc; stroke: #8097aa; stroke-width: 2; stroke-dasharray: 10 7; }
      .external { fill: #eef6ff; stroke: #3977aa; stroke-width: 2; }
      .ufrc { fill: #fff6df; stroke: #b7791f; stroke-width: 2; }
      .runtime { fill: #edf9f0; stroke: #2f855a; stroke-width: 2; }
      .readonly { fill: #f5f0ff; stroke: #7457a6; stroke-width: 2; }
      .writable { fill: #fff0f0; stroke: #b24a4a; stroke-width: 2; }
      .arrow { fill: none; stroke: #254b72; stroke-width: 3; marker-end: url(#arrow); }
      .dash-arrow { fill: none; stroke: #52697d; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1500" height="960" fill="#ffffff"/>
  <text x="750" y="52" text-anchor="middle" class="title">Panc Floyd / Islet Explorer — UFRC PubApps Reviewer Deployment</text>
  <text x="750" y="82" text-anchor="middle" class="subtitle">Public Restricted • Sensitive research release • no external runtime API or database service</text>

  <rect x="340" y="105" width="1120" height="760" rx="20" class="boundary"/>
  <text x="365" y="140" class="box-title">UFRC-managed hosting boundary</text>

  <rect x="35" y="170" width="255" height="130" rx="16" class="external"/>
  <text x="162" y="208" text-anchor="middle" class="box-title">Journal users</text>
  <text x="162" y="240" text-anchor="middle" class="body">Editors and reviewers</text>
  <text x="162" y="270" text-anchor="middle" class="small">Current desktop browser</text>

  <rect x="390" y="165" width="330" height="145" rx="16" class="ufrc"/>
  <text x="555" y="203" text-anchor="middle" class="box-title">UFRC HA reverse proxy</text>
  <text x="555" y="235" text-anchor="middle" class="body">TLS + whole-site Basic Auth</text>
  <text x="555" y="263" text-anchor="middle" class="small">WebSocket upgrade • HTTP Range</text>
  <text x="555" y="288" text-anchor="middle" class="small">Public URL and access logging</text>

  <rect x="790" y="155" width="620" height="300" rx="18" class="ufrc"/>
  <text x="1100" y="193" text-anchor="middle" class="box-title">PubApps virtual machine</text>
  <text x="1100" y="222" text-anchor="middle" class="small">Base allocation: 2 vCPU • 16 GiB RAM • 1 TiB /pubapps</text>

  <rect x="835" y="250" width="530" height="160" rx="16" class="runtime"/>
  <text x="1100" y="283" text-anchor="middle" class="box-title">VM loopback 127.0.0.1:3838</text>
  <text x="1100" y="313" text-anchor="middle" class="small">rootless Podman forwarding • user-mode Quadlet</text>
  <text x="1100" y="343" text-anchor="middle" class="body">Immutable Islet Explorer OCI image</text>
  <text x="1100" y="373" text-anchor="middle" class="small">Shiny container listens on 0.0.0.0:3838</text>
  <text x="1100" y="397" text-anchor="middle" class="small">Optional HPG-restricted staging: VM 127.0.0.1:3839</text>

  <path d="M290 220 L390 220" class="arrow"/>
  <text x="340" y="202" text-anchor="middle" class="small">HTTPS</text>
  <path d="M720 235 L835 305" class="arrow"/>
  <text x="766" y="247" text-anchor="middle" class="small">proxy</text>
  <path d="M390 278 L290 278" class="arrow"/>
  <text x="340" y="326" text-anchor="middle" class="small">HTML, plots, temporary CSV/PNG downloads</text>

  <rect x="390" y="515" width="305" height="265" rx="16" class="readonly"/>
  <text x="542" y="553" text-anchor="middle" class="box-title">Scientific release</text>
  <text x="542" y="585" text-anchor="middle" class="body">Read-only, versioned, checksummed</text>
  <text x="420" y="622" class="small">• Parquet summaries and hot tables</text>
  <text x="420" y="650" class="small">• embedded DuckDB queries (no port)</text>
  <text x="420" y="678" class="small">• per-donor indexed GeoPackages</text>
  <text x="420" y="706" class="small">• per-islet CSV drill-down files</text>
  <text x="420" y="734" class="small">• H5AD provenance/trajectory artifacts</text>

  <rect x="745" y="515" width="305" height="265" rx="16" class="readonly"/>
  <text x="897" y="553" text-anchor="middle" class="box-title">Image release</text>
  <text x="897" y="585" text-anchor="middle" class="body">Read-only OME-TIFF files</text>
  <text x="897" y="622" text-anchor="middle" class="small">Approximately 109 GiB</text>
  <text x="897" y="650" text-anchor="middle" class="small">Mounted below Shiny www/</text>
  <text x="897" y="678" text-anchor="middle" class="small">Browser requests only needed ranges</text>
  <text x="897" y="706" text-anchor="middle" class="small">No database BLOB storage</text>

  <rect x="1100" y="515" width="310" height="265" rx="16" class="writable"/>
  <text x="1255" y="553" text-anchor="middle" class="box-title">Writable runtime only</text>
  <text x="1255" y="585" text-anchor="middle" class="body">Bounded temporary directory</text>
  <text x="1255" y="615" text-anchor="middle" class="small">Session download generation</text>
  <text x="1255" y="650" text-anchor="middle" class="body">Operational logs</text>
  <text x="1255" y="680" text-anchor="middle" class="small">UFRC-approved path and retention</text>
  <text x="1255" y="716" text-anchor="middle" class="small">No canonical scientific-data writes</text>

  <path d="M640 515 L985 410" class="arrow"/>
  <path d="M920 515 L1100 410" class="arrow"/>
  <path d="M1215 410 L1245 515" class="arrow"/>

  <rect x="35" y="395" width="255" height="145" rx="16" class="external"/>
  <text x="162" y="433" text-anchor="middle" class="box-title">UF maintainers</text>
  <text x="162" y="466" text-anchor="middle" class="body">GatorLink + MFA</text>
  <text x="162" y="495" text-anchor="middle" class="small">Named primary and backup</text>
  <path d="M290 467 L790 390" class="dash-arrow"/>
  <text x="500" y="414" text-anchor="middle" class="small">HiPerGator login → SSH as PubApps project user</text>

  <rect x="35" y="665" width="255" height="145" rx="16" class="external"/>
  <text x="162" y="703" text-anchor="middle" class="box-title">Release ingress</text>
  <text x="162" y="736" text-anchor="middle" class="body">Authoritative HPG data</text>
  <text x="162" y="765" text-anchor="middle" class="small">Tested OCI archive via HPG</text>
  <text x="162" y="790" text-anchor="middle" class="small">Deployment only • SHA-256 verified</text>
  <path d="M290 735 L390 700" class="dash-arrow"/>

  <text x="900" y="825" text-anchor="middle" class="subtitle">Production AI, user uploads, Slurm jobs, inbound database ports, and third-party runtime connections: none</text>
</svg>
